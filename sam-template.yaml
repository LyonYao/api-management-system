AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API Management System - Serverless deployment

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: java17
    Architectures:
      - x86_64
    Environment:
      Variables:
        QUARKUS_PROFILE: prod

Parameters:
  DatabaseUrl:
    Type: String
    Description: PostgreSQL database URL (format: postgresql://host:port/database)
    Default: postgresql://localhost:5432/apimgmt
  
  DatabaseUsername:
    Type: String
    Description: Database username
    Default: postgres
  
  DatabasePassword:
    Type: String
    Description: Database password
    NoEcho: true
  
  VpcId:
    Type: String
    Description: VPC ID where RDS is located (leave empty for no VPC)
    Default: ""
  
  SubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of subnet IDs for Lambda (leave empty for no VPC)
    Default: ""
  
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of security group IDs (leave empty for no VPC)
    Default: ""
  
  DbPoolSize:
    Type: Number
    Description: Database connection pool size
    Default: 10
    MinValue: 5
    MaxValue: 50

Conditions:
  HasVpcConfig: !Not [!Equals [!Ref VpcId, ""]]

Resources:
  ApiManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: api-management-system
      Handler: io.quarkus.amazon.lambda.http.LambdaHttpHandler::handleRequest
      CodeUri: target/function.zip
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          DATABASE_USERNAME: !Ref DatabaseUsername
          DATABASE_PASSWORD: !Ref DatabasePassword
          JDBC_DATABASE_URL: !Sub 'jdbc:${DatabaseUrl}'
          DB_POOL_SIZE: !Ref DbPoolSize
          QUARKUS_PROFILE: prod
      VpcConfig:
        !If
          - HasVpcConfig
          - SubnetIds: !Ref SubnetIds
            SecurityGroupIds: !Ref SecurityGroupIds
          - !Ref AWS::NoValue
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApiEvent:
          Type: Api
          Properties:
            Path: /
            Method: ANY
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'

Outputs:
  ApiManagementApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
  ApiManagementFunction:
    Description: "Lambda Function ARN"
    Value: !GetAtt ApiManagementFunction.Arn
