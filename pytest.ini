[pytest]
# 测试目录
testpaths = test tests

# 测试文件模式
python_files = test_*.py *_test.py

# 测试函数模式
python_functions = test_*

# 测试类模式
python_classes = Test*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

# 报告配置
addopts = -v --tb=short --html=report.html --self-contained-html
