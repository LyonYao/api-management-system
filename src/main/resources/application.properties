# Application Configuration
quarkus.application.name=api-management-system

# Reactive PostgreSQL Client
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://localhost:5432/apimgmt}
quarkus.datasource.username=${DATABASE_USERNAME:apiuser}
quarkus.datasource.password=${DATABASE_PASSWORD:apipassword}
quarkus.datasource.reactive.max-size=20

# JDBC for Flyway
quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/apimgmt}

# Flyway for database migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# AWS Lambda Configuration
quarkus.lambda.handler=io.quarkus.amazon.lambda.http.LambdaHttpHandler
quarkus.lambda.enable-polling-jvm-mode=true

# Lambda Environment Variables Mapping
# Database connection from Lambda environment
%prod.quarkus.datasource.reactive.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USERNAME}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL}

# Lambda-specific optimizations
%prod.quarkus.datasource.reactive.max-size=${DB_POOL_SIZE:10}
%prod.quarkus.datasource.reactive.idle-timeout=PT5M
%prod.quarkus.datasource.reactive.max-lifetime=PT30M

# # Lambda cold start optimization
# quarkus.lambda.mock-event-server.dev-port=8081
# quarkus.lambda.mock-event-server.test-port=8082



# OpenAPI Configuration
quarkus.smallrye-openapi.path=/api/v1/openapi
quarkus.smallrye-openapi.info-title=API Management System
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Microservice API management and topology visualization system

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
# Bind HTTP server to all interfaces to ensure accessibility from localhost and external

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.company.apimgmt".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Bean Validation
quarkus.hibernate-validator.fail-fast=false

# Native build configuration for optimal cold start performance
quarkus.native.additional-build-args=\
  --initialize-at-run-time=io.vertx.core.impl.VertxImpl,\
  --initialize-at-run-time=io.netty.handler.codec.http.HttpObjectEncoder,\
  --initialize-at-run-time=io.netty.handler.codec.http2.Http2CodecUtil,\
  --initialize-at-run-time=io.netty.handler.ssl.ReferenceCountedOpenSslEngine,\
  -H:+ReportExceptionStackTraces,\
  -H:+PrintClassInitialization,\
  --enable-url-protocols=http,https

# Native image optimizations
quarkus.native.enable-http-url-handler=true
quarkus.native.enable-https-url-handler=true
quarkus.native.enable-all-security-services=false
quarkus.native.enable-isolates=false
quarkus.native.enable-fallback-images=false

# Reduce native image size
quarkus.native.compression.level=10
quarkus.native.compression.additional-args=--strip-debug

# Lambda-specific native optimizations
quarkus.native.resources.includes=db/migration/*,application.properties

# Class initialization at build time for faster startup
quarkus.native.additional-build-args.1=-H:+AllowVMInspection
quarkus.native.additional-build-args.2=-H:+ReportUnsupportedElementsAtRuntime
