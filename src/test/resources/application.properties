# Test configuration
quarkus.datasource.devservices.enabled=false
quarkus.test.native-image-profile=false

# Disable test containers for unit tests
%test.quarkus.test.integration-test-profile=false

# Disable Lambda mock server to avoid port conflicts
quarkus.lambda.mock-event-server.enabled=false
quarkus.lambda.enable-polling-jvm-mode=false
